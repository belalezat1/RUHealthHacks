# CI: proves the release works, including the real-time path, on every push and PR.
#   backend   - full pytest suite (snapshot 208/208, offer races, idempotency, restart persistence)
#   frontend  - type-check + production build
#   live-e2e  - builds both Docker images, starts the real stack with compose, and runs
#               scripts/smoke_live.py: imports new events and checks the UI's API shows them
#               within 3 s with no restart, then runs propose -> approve -> send -> accept.
#   restart   - restarts the API container and checks state (revision, offers, audit) survived.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Source data integrity
        run: python scripts/source_manifest.py --check
      - name: Tests
        run: python -m pytest backend/tests -q
      - name: Engine benchmark (CI runner, informational)
        run: python scripts/bench.py --runs 100 --out bench-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: bench-ci.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  live-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.sha }}
      SEVARO_MODE: hosted
      SEVARO_DEMO_PASSWORD: ci-only-password-123
      SEVARO_ALLOWED_ORIGINS: http://localhost:8080
      SEVARO_STATE_PATH: /tmp/sevaro-state
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent state directory
        run: mkdir -p /tmp/sevaro-state && sudo chown 10001 /tmp/sevaro-state
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Live smoke test (hosted-mode auth, CSRF, origin checks)
        run: python3 scripts/smoke_live.py --base http://localhost:8080 --origin http://localhost:8080 --password "$SEVARO_DEMO_PASSWORD"
      - name: Record state before restart
        run: |
          python3 scripts/state_probe.py --base http://localhost:8080 --password "$SEVARO_DEMO_PASSWORD" > before.json
          cat before.json
      - name: Restart API process and verify persistence
        run: |
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120
          python3 scripts/state_probe.py --base http://localhost:8080 --password "$SEVARO_DEMO_PASSWORD" > after.json
          cat after.json
          python3 - <<'EOF'
          import json
          b, a = json.load(open("before.json")), json.load(open("after.json"))
          assert b == a, f"state changed across restart:\n{b}\n{a}"
          print("state identical after restart")
          EOF
      - name: Backup and restore drill (separate path)
        run: |
          docker compose exec -T api python scripts/backup.py --out /state/backups/ci.sqlite3
          docker compose exec -T api python scripts/restore_check.py /state/backups/ci.sqlite3
      - name: Load test (20 users polling every 2 s for 60 s)
        run: python3 scripts/loadtest.py --base http://localhost:8080 --password "$SEVARO_DEMO_PASSWORD" --users 20 --seconds 60 --out load-ci.json
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-evidence
          path: |
            before.json
            after.json
            load-ci.json
      - if: always()
        run: docker compose down
