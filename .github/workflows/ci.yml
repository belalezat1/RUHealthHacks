name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: sevaro
          POSTGRES_PASSWORD: sevaro-test
          POSTGRES_DB: sevaro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sevaro -d sevaro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: demo
      JEV_MODE: mock
      DATABASE_URL: postgresql+psycopg://sevaro:sevaro-test@localhost:5432/sevaro
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.8.22
      - run: uv sync --frozen --extra solver
      - run: uv run ruff check app tests scripts
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json
      - run: docker build --target production -f backend/Dockerfile -t sevaro-api:ci .
        working-directory: .
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: docs
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/api/generated.ts
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
