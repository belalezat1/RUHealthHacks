# Static UI + same-origin API proxy. CloudFront (private VPC origin) -> this server on :8080 -> api:8000.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # API and health: never cached; cookies, query strings and CSRF headers pass through.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location /health/ {
        proxy_pass http://api:8000;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed build assets are immutable and safe to cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, so a new release is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
