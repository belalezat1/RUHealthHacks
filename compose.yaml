# Local development only. Run account provisioning explicitly; no default users.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sevaro
      POSTGRES_USER: sevaro
      POSTGRES_PASSWORD: ${SEVARO_LOCAL_DB_PASSWORD:?Set SEVARO_LOCAL_DB_PASSWORD in your ignored .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevaro -d sevaro"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: sevaro-command-center:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${SEVARO_LOCAL_WEB_PORT:-8080}:8000"
    environment:
      SEVARO_DATABASE_URL: postgresql://sevaro:${SEVARO_LOCAL_DB_PASSWORD}@db:5432/sevaro
      SEVARO_MODE: local
      SEVARO_AUTO_MIGRATE: "true"
      SEVARO_POLICY_MODE: challenge
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      SEVARO_JEV_MODEL: ${SEVARO_JEV_MODEL:-jev-latest}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
