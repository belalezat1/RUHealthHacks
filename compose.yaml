name: sevaro
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: development
  environment: &backend-environment
    APP_ENV: local
    AUTH_MODE: demo
    DATABASE_URL: postgresql+psycopg://sevaro:${POSTGRES_PASSWORD:-sevaro-local-only}@db:5432/sevaro
    TEST_DATABASE_URL: postgresql+psycopg://sevaro:${POSTGRES_PASSWORD:-sevaro-local-only}@db:5432/sevaro
    CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    JEV_MODE: ${JEV_MODE:-mock}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
    JEV_MODEL: ${JEV_MODEL:-jev-latest}
    JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-5}
    JEV_MAX_RETRIES: ${JEV_MAX_RETRIES:-1}
    DEMO_POLICY_PATH: /app/config/demo_policies.json

services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: sevaro
      POSTGRES_USER: sevaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevaro-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevaro -d sevaro"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    image: node:22.15.0-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: /v1
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_modules:
