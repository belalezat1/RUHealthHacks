[project]
name = "sevaro-command-center"
version = "0.1.0"
description = "Synthetic physician operations decision support demo"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic==2.11.4",
 "pydantic-settings==2.9.1", "SQLAlchemy==2.0.40", "psycopg[binary]==3.2.9",
 "alembic==1.15.2", "httpx==0.28.1", "PyJWT[crypto]==2.10.1",
]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.9", "pytest-asyncio==0.26.0"]
[project.optional-dependencies]
solver = ["ortools==9.12.4544"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: requires real PostgreSQL"]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
